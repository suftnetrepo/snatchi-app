name: React Native CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build and Test Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install

      - name: Fix React Native CLI version (prevent build break)
        run: |
          yarn add --dev @react-native-community/cli@15.1.3
          yarn add --dev @react-native-community/cli-platform-android@15.1.3

      - name: Complete job
        run: echo "CI job completed"
