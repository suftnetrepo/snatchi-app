name: React Native CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install yarn
        run: npm install -g yarn

      - name: Fix React Native CLI version (prevent build break)
        run: yarn add @react-native-community/cli@10.1.1 --dev

      - name: Install dependencies
        run: yarn install

      - name: Run ESLint (optional)
        run: yarn lint

      - name: Run Jest tests (optional)
        run: yarn test
