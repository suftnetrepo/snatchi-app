name: React Native CI

on:
  push:
    branches: [main]

jobs:
  build-android-ios:
    name: Build Android and iOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies with Yarn
        run: yarn install

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Build iOS App (simulator)
        run: |
          xcodebuild -workspace ios/snatchi.xcworkspace \
            -scheme snatchi \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath ios/build

      - name: Upload Android APK to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-west-2
        run: |
          aws s3 cp android/app/build/outputs/apk/release/app-release.apk s3://your-s3-bucket-name/builds/app-release.apk

      - name: Upload iOS App to S3 (simulator build .app bundle)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-west-2
        run: |
          aws s3 cp ios/build/Build/Products/Release-iphonesimulator/snatchi.app s3://your-s3-bucket-name/builds/snatchi.app --recursive
